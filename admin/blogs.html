<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Blogs | SR Unisex Salon</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f5f2;
            color: #222;
        }

        .navbar {
            background: #111;
            color: white;
            padding: 16px 30px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            font-size: 20px;
            font-weight: 600;
        }

        .nav-actions {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            border: 1px solid #555;
            background: transparent;
            color: white;
            padding: 9px 15px;
            border-radius: 7px;
            cursor: pointer;
        }

        .nav-btn:hover {
            background: #333;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 25px;
        }

        .page-header h1 {
            margin: 0 0 6px;
            font-size: 30px;
        }

        .page-header p {
            margin: 0;
            color: #777;
        }

        .create-btn {
            border: none;
            background: #111;
            color: white;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .create-btn:hover {
            opacity: 0.85;
        }

        .table-box {
            background: white;
            border-radius: 14px;
            overflow-x: auto;
            box-shadow: 0 5px 25px rgba(0,0,0,0.06);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th,
        td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #fafafa;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        td {
            font-size: 14px;
        }

        .title {
            font-weight: 600;
        }

        .slug {
            color: #777;
            font-size: 13px;
            margin-top: 5px;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .published {
            background: #e8f7ed;
            color: #187a3d;
        }

        .draft {
            background: #fff3cd;
            color: #856404;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .edit-btn,
        .delete-btn {
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .edit-btn {
            background: #eee;
            color: #222;
        }

        .delete-btn {
            background: #ffe7e7;
            color: #b00020;
        }

        .loading,
        .empty,
        .error {
            padding: 50px;
            text-align: center;
        }

        .loading {
            color: #777;
        }

        .empty {
            color: #777;
        }

        .error {
            color: #b00020;
        }

        @media (max-width: 600px) {

            .navbar {
                padding: 15px;
            }

            .container {
                margin: 25px auto;
                padding: 0 12px;
            }

            .page-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .page-header h1 {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>

    <header class="navbar">

        <div class="brand">
            SR Unisex Salon
        </div>

        <div class="nav-actions">

            <button
                class="nav-btn"
                id="dashboardBtn">
                Dashboard
            </button>

            <button
                class="nav-btn"
                id="logoutBtn">
                Logout
            </button>

        </div>

    </header>


    <main class="container">

        <div class="page-header">

            <div>

                <h1>
                    Manage Blogs
                </h1>

                <p>
                    Create, edit and manage your blog posts.
                </p>

            </div>

            <button
                class="create-btn"
                id="createBlogBtn">
                + Create New Blog
            </button>

        </div>


        <div
            class="table-box"
            id="tableBox">

            <div class="loading">
                Loading blogs...
            </div>

        </div>

    </main>


    <script>

        /* =========================================
           SUPABASE CONFIG
        ========================================= */

        const SUPABASE_URL =
            "https://pminjwfckghbhhssrmtr.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_g1VgEwpLvDzoT-JOFAWHtw_p4Ye1fNN";


        const {
            createClient
        } = supabase;


        const supabaseClient =
            createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        const tableBox =
            document.getElementById("tableBox");


        /* =========================================
           CHECK LOGIN
        ========================================= */

        async function checkLogin() {

            const {
                data,
                error
            } = await supabaseClient.auth.getSession();


            if (error || !data.session) {

                window.location.href =
                    "/admin/login.html";

                return false;
            }

            return true;
        }


        /* =========================================
           LOAD BLOGS
        ========================================= */

        async function loadBlogs() {

            const loggedIn =
                await checkLogin();

            if (!loggedIn) return;


            const {
                data,
                error
            } = await supabaseClient
                .from("blogs")
                .select("*")
                .order(
                    "updated_at",
                    {
                        ascending: false
                    }
                );


            if (error) {

                console.error(error);

                tableBox.innerHTML = `
                    <div class="error">
                        Unable to load blogs.<br><br>
                        ${escapeHtml(error.message)}
                    </div>
                `;

                return;
            }


            if (!data || data.length === 0) {

                tableBox.innerHTML = `
                    <div class="empty">
                        <h3>No blogs found</h3>
                        <p>Create your first blog post.</p>
                    </div>
                `;

                return;
            }


            let html = `

                <table>

                    <thead>

                        <tr>

                            <th>Blog</th>

                            <th>Category</th>

                            <th>Status</th>

                            <th>Created</th>

                            <th>Actions</th>

                        </tr>

                    </thead>

                    <tbody>
            `;


            data.forEach(blog => {

                const statusClass =
                    blog.published
                        ? "published"
                        : "draft";

                const statusText =
                    blog.published
                        ? "Published"
                        : "Draft";


                const date =
                    blog.updated_at
                        ? new Date(
                            blog.updated_at
                          ).toLocaleDateString(
                            "en-IN",
                            {
                                day: "2-digit",
                                month: "short",
                                year: "numeric"
                            }
                          )
                        : "-";


                html += `

                    <tr>

                        <td>

                            <div class="title">
                                ${escapeHtml(blog.title)}
                            </div>

                            <div class="slug">
                                /blog/${escapeHtml(blog.slug)}
                            </div>

                        </td>


                        <td>
                            ${escapeHtml(
                                blog.category || "-"
                            )}
                        </td>


                        <td>

                            <span
                                class="status ${statusClass}">
                                ${statusText}
                            </span>

                        </td>


                        <td>
                            ${date}
                        </td>


                        <td>

                            <div class="actions">

                                <button
                                    class="edit-btn"
                                    onclick="editBlog(${blog.id})">
                                    Edit
                                </button>

                                <button
                                    class="delete-btn"
                                    onclick="deleteBlog(${blog.id})">
                                    Delete
                                </button>

                            </div>

                        </td>

                    </tr>

                `;

            });


            html += `

                    </tbody>

                </table>

            `;


            tableBox.innerHTML = html;

        }


        /* =========================================
           EDIT BLOG
        ========================================= */

        function editBlog(id) {

            window.location.href =
                "/admin/edit-blog.html?id=" + id;

        }


        /* =========================================
           DELETE BLOG
        ========================================= */

        async function deleteBlog(id) {

            const confirmed =
                confirm(
                    "Are you sure you want to delete this blog?"
                );


            if (!confirmed) return;


            const {
                error
            } = await supabaseClient
                .from("blogs")
                .delete()
                .eq("id", id);


            if (error) {

                alert(
                    "Delete failed: " +
                    error.message
                );

                return;
            }


            alert(
                "Blog deleted successfully."
            );


            loadBlogs();

        }


        /* =========================================
           ESCAPE HTML
        ========================================= */

        function escapeHtml(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* =========================================
           NAVIGATION
        ========================================= */

        document
            .getElementById("createBlogBtn")
            .addEventListener(
                "click",
                () => {

                    window.location.href =
                        "/admin/create-blog.html";

                }
            );


        document
            .getElementById("dashboardBtn")
            .addEventListener(
                "click",
                () => {

                    window.location.href =
                        "/admin/dashboard.html";

                }
            );


        document
            .getElementById("logoutBtn")
            .addEventListener(
                "click",
                async () => {

                    await supabaseClient
                        .auth
                        .signOut();

                    window.location.href =
                        "/admin/login.html";

                }
            );


        /* =========================================
           START
        ========================================= */

        loadBlogs();

    </script>

</body>

</html>
